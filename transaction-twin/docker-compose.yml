services:
  postgres:
    image: postgres:16-alpine
    container_name: transaction-twin-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: transaction_twin
      POSTGRES_PASSWORD: transaction_twin
      POSTGRES_DB: transaction_twin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transaction_twin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
